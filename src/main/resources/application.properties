spring.application.name=guesthouse-booking-service-CI

# Port -- Railway provides PORT automatically, fallback to 8081
server.port=${PORT:8081}

# Datasource -- read from environment when deploying (defaults for local/k8s)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:booking-db}:${DB_PORT:3306}/${DB_NAME:bookingdb}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:${DB_DRIVER:com.mysql.cj.jdbc.Driver}}

# Hibernate dialect can be overridden if you use another DB (e.g. Postgres)
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Customer service base URL (configurable via env var CUSTOMER_SERVICE_BASE_URL)
# Use the public Railway URL for the customer service in production.
# Keep the default relative to the local Docker Compose hostname only as a fallback.
customer-service.base-url=${CUSTOMER_SERVICE_BASE_URL:https://guesthouse-customer-service-ci-production.up.railway.app/api/customers}

spring.jpa.hibernate.ddl-auto=update

logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error
