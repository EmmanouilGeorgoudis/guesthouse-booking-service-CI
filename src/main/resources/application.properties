spring.application.name=guesthouse-booking-service-CI

# Railway will set PORT env variable automatically; fall back to 8081 if local
server.port=${PORT:8081}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Database connection: read from Railway env vars or fall back to local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://booking-db:3306/bookingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Customer service endpoint: read from Railway env or fall back to local docker-compose
customer-service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://customer-service:8080/api/customers}

spring.jpa.hibernate.ddl-auto=update

logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error
