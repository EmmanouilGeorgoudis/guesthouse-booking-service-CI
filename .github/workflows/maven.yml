name: Java CI integrationTests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17,21]

    # Env for the application/tests so they can connect to the DB started
    # by docker-compose running on the same runner.
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bookingdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven (package, skip tests)
        run: ./mvnw -B -DskipTests package

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for app to be reachable (retry)
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/customer/1; then
              echo "app is up"; break;
            fi
            echo "waiting for app... ($i)"; sleep 2;
          done

      - name: Run tests
        run: ./mvnw test

      - name: Tear everything down
        if: always()
        run: docker compose down -v


